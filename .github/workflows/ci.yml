# W-6: no-hardware CI over the prototype verification scripts.
# See docs/infrastructure.ja.md. All jobs run without target hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # W-2: unified startup vs EVT startup ELF equivalence (13 variants)
  startup-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache xPack toolchain archive
        uses: actions/cache@v4
        with:
          path: ~/xpack-cache
          key: xpack-riscv-gcc-14.3.0-1-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch and extract toolchain
        run: |
          uv run --no-project python tools/index/fetch_xpack.py \
            --dest ~/xpack-cache --extract ~/xpack
      - name: Clone EVT mirrors (sparse, SRC only)
        run: |
          mkdir -p ~/mirrors && cd ~/mirrors
          for repo in CH32V003 CH32V006 CH32V103 CH32V20x CH32V205 CH32M030 CH32V307 CH32V407 CH32X035 CH32X315 CH32L103; do
            git clone --depth 1 --filter=blob:none --sparse "https://github.com/ch32-riscv-ug/$repo"
            git -C "$repo" sparse-checkout set EVT/EXAM/SRC
          done
      - name: Interrupt table must match the EVT startup sources
        run: uv run --no-project python tools/generate/import_vectors.py --mirrors "$HOME/mirrors" --check
      - name: Run equivalence harness
        run: |
          CH32_MIRROR_ROOT="$HOME/mirrors" \
          CH32_GCC_BIN="$HOME/xpack/xpack-riscv-none-elf-gcc-14.3.0-1/bin" \
          tests/startup/run_check.sh /tmp/w2

  # W-4: committed generated files must match regeneration from the locked
  # ch32-device-data commit (recorded in the generated boards.txt header)
  generated-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Clone ch32-device-data at the locked commit
        run: |
          commit=$(sed -n 's/^# source: ch32-device-data tables @ git \([0-9a-f]\{40\}\)$/\1/p' boards.txt)
          test -n "$commit" || { echo "no locked commit in boards.txt"; exit 1; }
          git clone https://github.com/ch32-riscv-ug/ch32-device-data ~/ch32-device-data
          git -C ~/ch32-device-data checkout "$commit"
      - name: Check regeneration matches committed files
        run: |
          uv run --no-project python tools/generate/generate.py \
            --tables ~/ch32-device-data/tables \
            --platform . --check

  # ADR-0009: the vendored ArduinoCore-API snapshot must stay byte-identical to
  # the upstream commit pinned in vendor/arduino-core-api.lock.toml
  api-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify cores/arduino/api against the pinned upstream commit
        run: tools/vendor/check_api_sync.sh /tmp/apisync

  # W-3/W-7: symlink-mode compile matrix over all generated part numbers
  compile-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache xPack toolchain archive
        uses: actions/cache@v4
        with:
          path: ~/xpack-cache
          key: xpack-riscv-gcc-14.3.0-1-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch and extract toolchain
        run: |
          uv run --no-project python tools/index/fetch_xpack.py \
            --dest ~/xpack-cache --extract ~/xpack
      - name: Compile all part numbers
        run: |
          CH32_GCC_BIN="$HOME/xpack/xpack-riscv-none-elf-gcc-14.3.0-1/bin" \
          tests/compile/test_compile.sh /tmp/w3 | tee /tmp/w3.log
      - name: Size regression check (W-7)
        run: |
          uv run --no-project python tests/compile/check_sizes.py \
            --baseline tests/compile/sizes_baseline.json \
            --sizes /tmp/w3/sizes.tsv --check
      - name: Size summary
        if: always()
        run: |
          { echo "### Compile sizes (${{ matrix.os }})"; echo '```'; \
            grep -E "compile Blink|Sketch uses|Global variables" /tmp/w3.log; \
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # W-5: clean Board Manager install via local HTTP, then compile with no overrides
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache xPack toolchain archive
        uses: actions/cache@v4
        with:
          path: ~/xpack-cache
          key: xpack-riscv-gcc-14.3.0-1-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch toolchain archive
        run: |
          uv run --no-project python tools/index/fetch_xpack.py \
            --dest ~/xpack-cache | tee /tmp/archive-path
      - name: Clean install and compile
        run: |
          CH32_XPACK_ARCHIVE=$(cat /tmp/archive-path) \
          tools/index/test_install.sh /tmp/w5
