name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "ch32rv-toolchain version to build with instead of the pinned one (a release, e.g. 23.1.6-1); empty: the pinned one"
        required: false
        default: ""

defaults:
  run:
    shell: bash

jobs:
  board-free-workspace:
    name: Board-free workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Run checks without hardware
        working-directory: tests
        run: uv run --locked pytest

  generated-sync:
    name: Generated platform and example profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Fetch pinned device data
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32-device-data
      - name: Check generated platform files
        run: uv run --no-project python tools/generate/generate.py --tables .tools/ch32-device-data --platform . --check
      - name: Check bundled example profiles
        run: uv run --no-project python tools/generate/sync_example_profiles.py --check

  vendor-provenance:
    name: Upstream source provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Compare ArduinoCore-API with the pinned upstream commit
        run: uv run --no-project python tools/vendor/check_api_sync.py "${{ runner.temp }}/api-sync"

  example-profiles:
    name: Example profiles
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - id: list
        run: echo "profiles=$(uv run --no-project python tools/index/build_examples.py --list-profiles)" >> "$GITHUB_OUTPUT"

  examples:
    name: Examples (${{ matrix.profile }})
    needs: example-profiles
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.example-profiles.outputs.profiles) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: arduino/setup-arduino-cli@v2
      - name: Toolchain given by hand
        if: ${{ inputs.toolchain != '' }}
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          [[ "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "toolchain must look like 23.1.6-1: got '$TOOLCHAIN'" >&2; exit 1; }
          uv run --no-project python tools/index/bump_tool.py ch32rv-toolchain "$TOOLCHAIN" --no-fetch
      - name: Cache tool archives
        uses: actions/cache@v6
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch pinned toolchain
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32rv-toolchain
      - name: Build every example for this profile
        # A compiler crash (clang's cc1 has segfaulted on ch32h416 now and then, 2026-11-24 / 25) leaves its
        # reproducer - the preprocessed source and the command as a script - in CLANG_CRASH_DIAGNOSTICS_DIR.
        env:
          CLANG_CRASH_DIAGNOSTICS_DIR: ${{ runner.temp }}/clang-crash
        run: uv run --no-project python tools/index/build_examples.py "${{ runner.temp }}/examples" --profile "${{ matrix.profile }}" --warnings all --fail-on-warning
      - name: Keep compiler crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clang-crash-${{ matrix.profile }}
          path: ${{ runner.temp }}/clang-crash
          if-no-files-found: ignore
          retention-days: 30

  install-test:
    name: Package install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: arduino/setup-arduino-cli@v2
      - name: Toolchain given by hand
        if: ${{ inputs.toolchain != '' }}
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          [[ "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "toolchain must look like 23.1.6-1: got '$TOOLCHAIN'" >&2; exit 1; }
          uv run --no-project python tools/index/bump_tool.py ch32rv-toolchain "$TOOLCHAIN" --no-fetch
      - name: Cache tool archives
        uses: actions/cache@v6
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch pinned toolchain
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32rv-toolchain
      - name: Install package and compile in isolated directories
        run: uv run --no-project python tools/index/install_check.py "${{ runner.temp }}/ch32-package-check"
