name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  board-free-workspace:
    name: Board-free workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run checks without hardware
        working-directory: tests
        run: uv run --locked pytest

  generated-sync:
    name: Generated platform and example profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch pinned device data
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32-device-data
      - name: Check generated platform files
        run: uv run --no-project python tools/generate/generate.py --tables .tools/ch32-device-data --platform . --check
      - name: Check bundled example profiles
        run: uv run --no-project python tools/generate/sync_example_profiles.py --check

  vendor-provenance:
    name: Upstream source provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Compare ArduinoCore-API with the pinned upstream commit
        run: uv run --no-project python tools/vendor/check_api_sync.py "${{ runner.temp }}/api-sync"
      - name: Check TinyUSB source lock
        run: uv run --no-project python tools/vendor/vendor_tinyusb.py --check

  install-test:
    name: Package install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache tool archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch pinned toolchain
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      - name: Install package and compile in isolated directories
        run: uv run --no-project python tools/index/install_check.py "${{ runner.temp }}/ch32-package-check"
