# W-6: no-hardware CI over the prototype verification scripts.
# See docs/infrastructure.ja.md. All jobs run without target hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # On a laptop a missing tool is a skip; in CI it means provisioning broke and
  # the run would go green having checked nothing. See tests/conftest.py.
  CH32_TESTS_REQUIRE_TOOLS: "1"

jobs:
  # W-2: unified startup vs EVT startup ELF equivalence (13 variants)
  startup-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      - name: Clone EVT mirrors (sparse, SRC only)
        run: |
          mkdir -p ~/mirrors && cd ~/mirrors
          for repo in CH32V003 CH32V006 CH32V103 CH32V20x CH32V205 CH32M030 CH32V307 CH32V407 CH32X035 CH32X315 CH32L103; do
            git clone --depth 1 --filter=blob:none --sparse "https://github.com/ch32-riscv-ug/$repo"
            git -C "$repo" sparse-checkout set EVT/EXAM/SRC
          done
      - name: Startup equivalence and interrupt tables
        working-directory: tests
        run: CH32_MIRROR_ROOT="$HOME/mirrors" uv run pytest -q test_startup_equivalence.py test_interrupt_tables.py

  # W-4: committed generated files must match regeneration from the locked
  # ch32-device-data commit (recorded in the generated boards.txt header)
  generated-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # fetch_tools.py checks out the commit boards.txt locks, so this compares
      # against exactly the tables the committed files were generated from.
      - name: Fetch the device-data tables at the locked commit
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32-device-data
      - name: Generated files and sketch profiles are in sync
        working-directory: tests
        run: uv run pytest -q test_generated.py

  # ADR-0009: the vendored ArduinoCore-API snapshot must stay byte-identical to
  # the upstream commit pinned in vendor/arduino-core-api.lock.toml
  api-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify cores/arduino/api against the pinned upstream commit
        working-directory: tests
        run: uv run pytest -q test_vendored_api.py

  # W-3/W-7: symlink-mode compile matrix over all generated part numbers
  compile-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      # Compile sweeps plus the size baseline, as one pytest run so a failure
      # names the check rather than a shell exit code.
      - name: Compile matrix, sketch profiles and size baseline
        working-directory: tests
        run: uv run pytest -q test_compile_matrix.py test_sketch_profiles.py test_sizebench.py

  # W-5: clean Board Manager install via local HTTP, then compile with no overrides
  #
  # Windows is covered again: probe-rs now comes from ch32-riscv-ug/mirror-probe-rs
  # (ADR-0011), whose Windows archive carries the single root directory
  # arduino-cli requires. With the upstream zip this job failed on Windows with
  # "searching package root dir: files in archive must be placed in a
  # subdirectory".
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      # Two things share this job because they share its expensive part: a
      # generated index served on loopback and a 400 MB toolchain to fetch.
      # test_sketch_profile_build.py covers what neither the compile sweeps nor
      # the install test do - `arduino-cli compile --profile`, which is what
      # the instructions tell a user to type, resolving the platform through
      # the index rather than through --fqbn.
      - name: Clean install, and build every sketch profile
        working-directory: tests
        run: uv run pytest -q test_package_install.py test_sketch_profile_build.py
