# W-6: no-hardware CI over the prototype verification scripts.
# See docs/infrastructure.ja.md. All jobs run without target hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # On a laptop a missing tool is a skip; in CI it means provisioning broke and
  # the run would go green having checked nothing. See tests/conftest.py.
  CH32_TESTS_REQUIRE_TOOLS: "1"

jobs:
  # W-2: unified startup vs EVT startup ELF equivalence (13 variants)
  startup-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      - name: Clone EVT mirrors (sparse, SRC only)
        run: |
          mkdir -p ~/mirrors && cd ~/mirrors
          for repo in CH32V003 CH32V006 CH32V103 CH32V20x CH32V205 CH32M030 CH32V307 CH32V407 CH32X035 CH32X315 CH32L103; do
            git clone --depth 1 --filter=blob:none --sparse "https://github.com/ch32-riscv-ug/$repo"
            git -C "$repo" sparse-checkout set EVT/EXAM/SRC
          done
      - name: Startup equivalence and interrupt tables
        working-directory: tests
        run: CH32_MIRROR_ROOT="$HOME/mirrors" uv run pytest -q startup

  # W-4: committed generated files must match regeneration from the locked
  # ch32-device-data commit (recorded in vendor/ch32-device-data.lock.toml)
  generated-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # fetch_tools.py checks out the commit the lock records, so this compares
      # against exactly the tables the committed files were generated from.
      - name: Fetch the device-data tables at the locked commit
        run: uv run --no-project python tools/index/fetch_tools.py --tool ch32-device-data
      # The layout check rides along: it needs no toolchain, and a category
      # directory that stops being collected is invisible in every other job.
      - name: Generated files, sketch profiles and the test layout
        working-directory: tests
        run: uv run pytest -q generated unit/test_tests_layout.py

  # Every vendored snapshot against its lock: cores/arduino/api byte-identical
  # to the commit pinned in vendor/arduino-core-api.lock.toml (ADR-0009), and
  # libraries/TinyUSB/src hashing to what vendor/tinyusb.lock.toml records.
  # The whole directory rather than one file, so a new lock is covered the day
  # it is added instead of the day someone remembers this workflow.
  vendor-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify every vendored snapshot against its lock
        working-directory: tests
        run: uv run pytest -q vendor

  # W-3/W-7: symlink-mode compile matrix over all generated part numbers
  compile-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      # Compile sweeps plus the size baseline, as one pytest run so a failure
      # names the check rather than a shell exit code.
      #
      # The examples and the prescaler table ride along because this is the job
      # that already has a compiler: the examples are the only code no other
      # test builds, and the prescaler test is a _Static_assert probe that needs
      # riscv-none-elf-gcc and nothing else. Together they add about a minute.
      - name: Compile matrix, examples, sketch profiles and size baseline
        working-directory: tests
        run: uv run pytest -q compile sketches/test_sketch_profiles.py sizebench unit/test_clock_prescaler.py

  # Every example for every series (~20 min). Its own job, Linux only, because
  # what it checks is the target's C code, not the host OS - the OS axis is
  # already covered by compile-matrix above, and multiplying 20 minutes by
  # three runners buys nothing. See docs/examples-build-rules.ja.md.
  #
  # Which series an example is built for is the example's own `requires:` line,
  # not a list kept in CI.
  example-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      - name: Build every example for every series
        working-directory: tests
        run: uv run pytest -q --sweep compile/test_examples_sweep.py

  # W-5: clean Board Manager install via local HTTP, then compile with no overrides
  #
  # Windows is covered again: probe-rs now comes from ch32-riscv-ug/mirror-probe-rs
  # (ADR-0011), whose Windows archive carries the single root directory
  # arduino-cli requires. With the upstream zip this job failed on Windows with
  # "searching package root dir: files in archive must be placed in a
  # subdirectory".
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: arduino/setup-arduino-cli@v2
      # Everything the tests need goes into <repo>/.tools, at versions taken from
      # the tool definition fragments and verified against their checksums.
      # Same command a contributor runs, so CI and a laptop are the same setup.
      - name: Cache the downloaded archives
        uses: actions/cache@v4
        with:
          path: .tools/cache
          key: tools-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/index/tools_*.json') }}
      - name: Fetch tools
        run: uv run --no-project python tools/index/fetch_tools.py --tool xpack-riscv-none-elf-gcc
      # Two things share this job because they share its expensive part: a
      # generated index served on loopback and a 400 MB toolchain to fetch.
      # sketches/test_sketch_profile_build.py covers what neither the compile
      # sweeps nor the install test do - `arduino-cli compile --profile`, the
      # command the instructions tell a user to type, resolving the platform
      # through the index rather than through --fqbn.
      - name: Clean install, and build every sketch profile
        working-directory: tests
        run: uv run pytest -q package sketches/test_sketch_profile_build.py
