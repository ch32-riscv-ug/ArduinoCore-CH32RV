# Publish the one tool archive this project has to re-host.
#
# probe-rs ships Linux and macOS as tarballs with a single root directory,
# which is what arduino-cli requires, so the package index links those straight
# to the upstream release (ADR-0002: no re-hosting). The Windows zip is flat -
# seven files at the archive root - and arduino-cli refuses it:
#
#   Cannot install tool ch32-riscv-ug:probe-rs@0.32.0: searching package root
#   dir: files in archive must be placed in a subdirectory
#
# So that archive, and only that archive, is repacked under a root directory
# and attached to a release here. repack_probe_rs.py is deterministic and
# verifies the upstream download against the checksum in tools_probe_rs.json,
# so anyone can rebuild this asset and confirm it matches the index.
#
# Run this once per probe-rs version, before the release that references it.
# The tag it creates is a tool tag (tools-probe-rs-<version>), separate from
# the platform's own v<version> tags.
name: Publish re-hosted tool

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload as a run artifact only; do not create a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Read the probe-rs version from the tool fragment
        id: tool
        run: |
          version=$(uv run --no-project python -c \
            "import json;print(json.load(open('tools/index/tools_probe_rs.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=tools-probe-rs-$version" >> "$GITHUB_OUTPUT"

      # Fails if the download does not match upstreamChecksum, so a tampered or
      # silently re-cut upstream asset stops here rather than being published.
      - name: Repack
        run: uv run --no-project python tools/index/repack_probe_rs.py --out dist

      # The index pins a SHA-256. If what we just built does not match what
      # tools_probe_rs.json already claims, the index and the asset would
      # disagree the moment this is published.
      - name: The built archive must match the checksum the index pins
        run: |
          uv run --no-project python - <<'PY'
          import hashlib, json, pathlib, sys
          frag = json.load(open("tools/index/tools_probe_rs.json"))
          built = {p.name: "SHA-256:" + hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in pathlib.Path("dist").glob("*.zip")}
          bad = []
          for s in frag["systems"]:
              want = built.get(s["archiveFileName"])
              if want is None:
                  continue          # not a re-hosted archive
              if want != s["checksum"]:
                  bad.append(f"{s['archiveFileName']}: built {want} != index {s['checksum']}")
          if bad:
              sys.exit("\n".join(bad) + "\nrerun repack_probe_rs.py --update and commit")
          print(f"checksums match for {sorted(built)}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rehosted-tools
          path: dist/

      - name: Create the tool release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tool.outputs.tag }}'
          gh release create "$tag" --repo "${{ github.repository }}" \
            --title "probe-rs ${{ steps.tool.outputs.version }} (repacked for Board Manager)" \
            --notes "Upstream probe-rs ${{ steps.tool.outputs.version }} Windows archive, repacked under a single root directory so arduino-cli can install it. Contents are byte-identical to the upstream release; rebuild and verify with \`tools/index/repack_probe_rs.py\`. probe-rs is MIT/Apache-2.0; both license files are inside the archive." \
            dist/*.zip \
          || gh release upload "$tag" dist/*.zip --repo "${{ github.repository }}" --clobber
