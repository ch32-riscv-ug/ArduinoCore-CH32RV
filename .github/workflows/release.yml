# Publish a Board Manager release - the same shape as host-arduino-core's.
#
# Run it from the Actions UI choosing which part to bump (patch / minor /
# major, from the latest v<X.Y.Z> tag; or type an exact version instead), or
# push a tag v<version>. The workflow then
#   1. writes the version everywhere (tools/index/bump_version.py: platform.txt
#      and every sketch.yaml's platform pin) and moves CHANGELOG.md's
#      Unreleased items under the version (tools/index/prepare_release.py),
#   2. builds the platform archive and the package index (gen_index.py), the
#      index merged onto the committed package_ch32-riscv-ug_index.json,
#   3. commits those back to main and tags v<version>,
#   4. publishes the index to GitHub Pages (gh-pages branch) and attaches the
#      archive to a GitHub Release whose body is the version's CHANGELOG.md
#      section.
#
# The index is append-only and its history is the committed copy: every
# release merges onto it, so a version pinned in someone's sketch.yaml stays
# installable after the next one ships.
#
# Before releasing, adopt any pending ch32-device-data update by hand
# (tools/generate/README.ja.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest release's version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an exact version (X.Y.Z, without v); overrides bump when set"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Determine version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            last=${last#v}
            [ -n "$last" ] || { echo "no v<X.Y.Z> tag to bump from"; exit 1; }
            IFS=. read -r major minor patch <<< "$last"
            case "$INPUT_BUMP" in
              major) v="$((major + 1)).0.0" ;;
              minor) v="$major.$((minor + 1)).0" ;;
              *)     v="$major.$minor.$((patch + 1))" ;;
            esac
            echo "bump $INPUT_BUMP: $last -> $v"
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null && [ "${{ github.event_name }}" != "push" ]; then
            echo "v$v is already released"; exit 1
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be X.Y.Z, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Write the version
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          uv run --no-project python tools/index/bump_version.py "$V"
          uv run --no-project python tools/index/prepare_release.py --version "$V" --body release_body.md
          uv run --no-project python tools/generate/sync_example_profiles.py --check

      - name: Build the archive and the index
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          index=package_ch32-riscv-ug_index.json
          merge=""
          if [ -f "$index" ]; then merge="--merge $index"; fi
          uv run --no-project python tools/index/gen_index.py \
            --platform . --out dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$V" \
            --tools github $merge
          cp "dist/$index" "$index"
          mkdir -p package
          cp "dist/$index" package/
          # The top page reads the index next to it for the versions and boards.
          cp tools/index/pages_index.html package/index.html

      - name: Commit the release changes back to main
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add platform.txt package_ch32-riscv-ug_index.json CHANGELOG.md
          git ls-files -z -- '*sketch.yaml' | xargs -0 git add
          if git diff --staged --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }}"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:main
          fi

      - name: Ensure the tag exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          TAG=v${{ steps.ver.outputs.version }}
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$TAG"
          fi

      # The archive has to exist at the URL the index names before anyone can
      # install from that index, so the Release goes up before Pages.
      - name: Create the GitHub Release and attach the archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            dist/*.tar.bz2
            dist/package_ch32-riscv-ug_index.json

      - name: Publish the index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./package
          publish_branch: gh-pages
