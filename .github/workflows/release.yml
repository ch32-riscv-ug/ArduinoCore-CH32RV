# Publish a Board Manager release - the same shape as host-arduino-core's.
#
# Run it from the Actions UI with the version to release (X.Y.Z), or push a tag
# v<version>. The workflow then
#   1. writes the version everywhere (tools/index/bump_version.py: platform.txt
#      and every sketch.yaml's platform pin),
#   2. builds the platform archive and the package index (gen_index.py), the
#      index merged onto the committed package_ch32-riscv-ug_index.json,
#   3. commits those back to main and tags v<version>,
#   4. publishes the index to GitHub Pages (gh-pages branch) and attaches the
#      archive to a GitHub Release with notes generated from Git history.
#
# The index is append-only and its history is the committed copy: every
# release merges onto it, so a version pinned in someone's sketch.yaml stays
# installable after the next one ships.
#
# Before releasing, adopt any pending ch32-device-data update by hand
# (tools/generate/README.ja.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, without v). Empty uses the tag name."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            tag=${GITHUB_REF_NAME:-$(git describe --tags --abbrev=0)}
            v="${tag#v}"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be X.Y.Z, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Write the version
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          uv run --no-project python tools/index/bump_version.py "$V"
          uv run --no-project python tools/generate/sync_example_profiles.py --check

      - name: Build the archive and the index
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          index=package_ch32-riscv-ug_index.json
          merge=""
          if [ -f "$index" ]; then merge="--merge $index"; fi
          uv run --no-project python tools/index/gen_index.py \
            --platform . --out dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$V" \
            --tools github $merge
          cp "dist/$index" "$index"
          mkdir -p package
          cp "dist/$index" package/
          # The top page reads the index next to it for the versions and boards.
          cp tools/index/pages_index.html package/index.html

      - name: Commit the release changes back to main
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add platform.txt package_ch32-riscv-ug_index.json
          git ls-files -z -- '*sketch.yaml' | xargs -0 git add
          if git diff --staged --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }}"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:main
          fi

      - name: Ensure the tag exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          TAG=v${{ steps.ver.outputs.version }}
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$TAG"
          fi

      # The archive has to exist at the URL the index names before anyone can
      # install from that index, so the Release goes up before Pages.
      - name: Create the GitHub Release and attach the archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.bz2
            dist/package_ch32-riscv-ug_index.json

      - name: Publish the index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./package
          publish_branch: gh-pages
