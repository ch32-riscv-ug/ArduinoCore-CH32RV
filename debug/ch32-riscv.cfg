# OpenOCD configuration for CH32 RISC-V parts behind a WCH-Link.
#
# This platform does not ship OpenOCD (docs/debug-output.ja.md says where to get
# one); what it ships is this configuration, so that `arduino-cli debug` has a
# script to hand the server. It only works with a build that has WCH's `wlinke`
# adapter driver and `wch_riscv` target/flash drivers - a stock OpenOCD has
# neither, and will stop at the first line.
#
# The command set is what that driver requires: its own transport ("sdi", WCH's
# one- and two-wire debug interface, not JTAG or SWD), a tap and target of type
# wch_riscv, and a flash bank whose geometry the driver reads from the part.

adapter driver wlinke
adapter speed 6000
transport select sdi

# Where flash starts as the debug module sees it. The driver rewrites this per
# family once it has identified the part.
wlink_set_address 0x00000000

set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME

# A work area in SRAM lets the flash driver run its programming loop on the
# target instead of writing word by word over the wire. Backed up and restored,
# so a debug session does not corrupt the sketch's RAM.
$_TARGETNAME.0 configure -work-area-phys 0x20000000 -work-area-size 0x10000 -work-area-backup 1

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME wch_riscv 0x00000000 0 0 0 $_TARGETNAME.0
