name=CH32RVSyncKit
version=0.1.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=Queues, notifications, byte and message buffers, a block pool, short locks, critical sections, deadlines and periods - for interrupts and loop() on one core, without an RTOS.
paragraph=Header-only and non-blocking: every operation tries once and returns. Each object says whether an ISR shares it (IsrSafe, the default: a few instructions with interrupts masked) or only loop() uses it (LoopOnly: no masking). Names follow ESP32SyncKit (trySend / tryReceive / notify / tryTake / setBits / tryWaitBits) so the habits carry over to ESP32 and FreeRTOS; there are no waiting forms.
category=Other
