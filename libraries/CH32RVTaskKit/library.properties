name=CH32RVTaskKit
version=0.1.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=Short pieces of work that run when an interrupt, a deadline, a period or a condition says so - one visible runOnce() in loop(), no stacks, no RTOS.
paragraph=Optional: steps called from loop() need none of it. Each Work is a function that returns quickly plus its triggers; Executor::runOnce() runs the ready ones once each, never nested, never from delay() or an interrupt. Optional run counts and times per Work show which one is slow. Uses CH32RVSyncKit's Deadline and Period.
category=Other
includes=CH32RVTaskKit.h
depends=CH32RVSyncKit
url=https://github.com/ch32-riscv-ug/ArduinoCore-CH32RV
architectures=ch32rv
