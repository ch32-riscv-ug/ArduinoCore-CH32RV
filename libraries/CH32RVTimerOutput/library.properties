sentence=Timer outputs beyond analogWrite(): complementary PWM with dead time and a break input, one-pulse mode, and output compare.
paragraph=CHx and CHxN of an advanced timer as a half bridge's two sides, a single pulse exact to the timer's tick (started by the sketch or by an edge in hardware), and a channel that goes active, inactive or toggles at a set time in each period. Pads on any route the chip offers; the timer is borrowed through CH32RVTimer.h like analogWrite().
