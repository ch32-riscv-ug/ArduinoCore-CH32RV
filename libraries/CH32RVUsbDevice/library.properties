name=CH32RVUsbDevice
version=0.1.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=The chip's own USB as a device: CDC serial (SerialUSB), HID, MIDI, vendor bulk with WebUSB, mass storage, smart card reader, network (NCM), audio (UAC1/UAC2), camera (UVC) and DFU runtime, composed by declaring them.
paragraph=Runs on CH32X035/X033, CH32V103, V203/V208, V303 (USBFS) and V305/V307/V317 (USBFS or USBHS). Only the classes a sketch declares are linked. A 1200 bps touch or a DFU_DETACH resets into the factory USB bootloader for ch32rv.
category=Communication
