sentence=The chip's own USB as a host: keyboards, mice and other HID, CDC serial (and FTDI/CP210x/CH34x/PL2303), MIDI, mass storage, vendor bulk and CCID smart-card readers, through a hub too.
paragraph=EspUsbHost's API on this core's own host stack and controller driver. Runs on CH32X035 R8T6/C8T6/G8U6/G8R6 (the F8U6, F7P6, D8U6 and X033 are device-only), CH32V203/V208 and CH32V303/V305/V307/V317 (USBFS); begin() reports Unsupported elsewhere. Only the function groups a sketch uses are linked.
