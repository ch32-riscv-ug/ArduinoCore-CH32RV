sentence=Ask a USB PD charger for a voltage (sink): list its profiles, request fixed levels or PPS. Or offer voltages as a USB PD source.
paragraph=Talks to the USBPD block found on CH32X035/X033, CH32L103/M103, CH32V205, CH32X305/X315 and CH32M030. The driver runs on CH32X035/X033 (verified against fixed and PPS chargers); on the other series begin() reports unavailable until their block is described.
