sentence=Ask a USB PD charger for a voltage (sink): list its profiles, request fixed levels or PPS. Or offer voltages as a USB PD source.
paragraph=Talks to the USBPD block found on CH32X035, CH32L103/M103, CH32V205, CH32X305/X315, CH32H41x and CH32M030. The driver runs on CH32X035 (verified against fixed and PPS chargers) and is built for L103/M103, V205, X305/X315 and H41x; on X033 (no CC pad) and M030 begin() reports unavailable.
