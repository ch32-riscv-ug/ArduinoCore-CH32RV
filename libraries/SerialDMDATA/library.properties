sentence=Two-way serial through the debug module's data registers, in minichlink's framing.
paragraph=The same two registers SerialSDI uses, with the agreement ch32fun's minichlink speaks: up to seven bytes out and three in per handshake, so read() works. Uses no pin and no RAM buffer, and never halts the core. Cannot be used together with SerialSDI.
