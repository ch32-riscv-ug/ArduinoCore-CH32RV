name=SerialDMSeq
version=1.0.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=Two-way serial through the debug module's data registers, with sequence numbers and a CRC (dmseq).
paragraph=The same two registers SerialDMDATA uses, in the dmseq framing: a sequence number each way and a CRC-8 on every word, so a lost or corrupted debug access neither duplicates nor drops a byte. Up to six bytes out and two in per frame. Uses no pin and never halts the core. Read it with ch32rv monitor --source dmseq or an OEP probe. Cannot be used together with SerialSDI or SerialDMDATA.
category=Communication
