sentence=Two-way serial through a RAM ring buffer the debug probe reads while the core runs.
paragraph=Keeps the publicly documented RTT control block in RAM, which probe-rs finds and streams with `probe-rs attach`. Uses no pin and never halts the core, and read() works because the host writes a second buffer. Costs RAM rather than a host tool, which is the trade against SerialSDI and SerialDMDATA.
