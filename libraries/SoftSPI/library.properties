name=SoftSPI
version=1.0.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=Bit-banged SPI on any three pads, with the same API as SPI.
paragraph=A controller-mode SPI that uses nothing but pinMode and digitalWrite, so it runs on pads the hardware SPI cannot reach - which on the small CH32 parts is most of them. Derives from HardwareSPI, so a library written against SPIClass& takes one unchanged. Slower than the peripheral; the clock is whatever the loop runs at.
category=Communication
