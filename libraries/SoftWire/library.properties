name=SoftWire
version=1.0.0
author=ch32-riscv-ug
maintainer=ch32-riscv-ug
sentence=Bit-banged I2C on any two pads, with the same API as Wire.
paragraph=A controller-mode I2C that uses nothing but pinMode and digitalWrite, so it runs on pads the hardware I2C cannot reach. Both lines are true open-drain, and clock stretching is honoured. Derives from HardwareI2C, so a library written against TwoWire& takes one unchanged. The bus still needs pull-up resistors.
category=Communication
