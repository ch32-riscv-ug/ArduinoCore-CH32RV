paragraph=Arduino's SoftwareSerial API (begin, listen, isListening, overflow, read, write) on GPIO: receive from the start bit's pin-change interrupt, timed by SysTick; transmit with interrupts held for each frame (half duplex, as on AVR). Formats 5-8 data bits, parity and two stop bits through begin(speed, config).
