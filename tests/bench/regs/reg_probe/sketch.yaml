# The debugger as the judge: the host tells the sketch which core API to call
# (pinMode, digitalWrite, Serial.begin / setRoute, attachInterrupt, analogWrite,
# tone, Wire, SPI ...), then reads the peripheral registers through the probe
# and compares them with what ch32-device-data says they must hold - GPIO
# CNF/MODE and pulls, AFIO remap fields, USART / TIM / ADC / DAC / I2C / SPI
# registers, RCC and SysTick, EXTI and PFIC. No wiring; needs an OEP bench (the
# reads go through riscv-dm) and the device-data tables in <repo>/.tools.
#
# The profile list below is generated - see tests/build/sketches/sync_profiles.py.

# --- generated by sync_profiles.py: do not edit below ---
profiles:
  # tier A: main target; 24-bit ports, 48 MHz, 2 wait states
  ch32x035:
    fqbn: ch32-riscv-ug:ch32rv:CH32X035:pnum=ANY
    port_config:
      source: dmseq
    platforms:
      - platform: ch32-riscv-ug:ch32rv

  # tier A CH32V003: omitted, requires 32 KB flash, CH32V003 ANY has 16 KB
  # tier B: the mainstream V2 part
  ch32v203:
    fqbn: ch32-riscv-ug:ch32rv:CH32V203:pnum=ANY
    port_config:
      source: dmseq
    platforms:
      - platform: ch32-riscv-ug:ch32rv

  # tier B: low-power V4C
  ch32l103:
    fqbn: ch32-riscv-ug:ch32rv:CH32L103:pnum=ANY
    port_config:
      source: dmseq
    platforms:
      - platform: ch32-riscv-ug:ch32rv

  # tier B: the only family with a jump-table vector
  ch32v103:
    fqbn: ch32-riscv-ug:ch32rv:CH32V103:pnum=ANY
    port_config:
      source: dmseq
    platforms:
      - platform: ch32-riscv-ug:ch32rv

  # tier B: largest part on the bench
  ch32v307:
    fqbn: ch32-riscv-ug:ch32rv:CH32V307:pnum=ANY
    port_config:
      source: dmseq
    platforms:
      - platform: ch32-riscv-ug:ch32rv

  # tier B CH32V006: omitted, requires 32 KB flash, CH32V006 ANY has 16 KB
default_profile: ch32x035
