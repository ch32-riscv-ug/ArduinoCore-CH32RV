# Does our own crt0 hand setup() a correctly initialised RAM? After the upload the
# probe halts the part, fills RAM with a pattern and resets it; a C++ global
# constructor - the first user code crt0 runs - reports what it saw: .bss zero,
# .data copied from flash, .init_array run, and the pattern still past _ebss
# (the control: without it "bss was zero" proves nothing on a part whose RAM
# powers up at zero). Needs an OEP bench (the probe writes RAM); others skip.
