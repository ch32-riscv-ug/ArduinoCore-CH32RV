# The CH32L103 bench on the SparkFun Pro Micro RP2350 (an RP2350 OEP probe, USB CDC = a
# serial OEP probe). Provisional wiring: only the debug pair is known - found by
# `oep.wire.rvswd` scan on 2026-09-30 (GP0 = SWDIO, GP1 = SWCLK; the L103 is uid
# 3a6fabcda284bc48, a different board from the one behind WCH-LinkE 0E028F0692F1). No UART
# and no other pad is known to reach the probe, so the tests that need them skip. tests/.env:
#
#   TEST_SERIAL_PORT_CH32L103=oep://9489dd2ae0953650/l103
#   TEST_BENCH_CH32L103=l103-rp2350
#
# The oep:// form even though the link is serial: ch32rv (0.13) enumerates the RP2350's CDC as an OEP
# probe and takes only its slot address for a flash (`ch32rv arduino discovery` lists it); the bench
# finds the CDC device by the unit id in it (benchdef.Bench.serial_device). An ESP32 bridge, which has
# no unit id on the USB side, stays a device path (v003-esp32).
#
# prepare.py: the RP2 is flashed by copying the release's .uf2 onto its BOOTSEL drive (1200 baud
# on the CDC puts it there). That route lands with the native-Linux bench the RP2 jigs move to
# (on this WSL host the drive is not writable from the bench); `--config` and `--check` work.

[probe]
kind = "oep"
transport = "serial"                         # the OEP link is the probe's CDC port (found by the unit id in the oep:// port)
model = "rp2350"                             # oep.core describe: model
firmware = "0.0.29-dev+3169721"                          # oep.core describe: firmware = the oep-probe-arduino release version
release = "v0.0.28"                          # oep-probe-arduino tag
example = "Firmware/OepProbe"                # examples/<example> in that tag
sketch_profile = "promicrorp2350"            # its sketch.yaml profile for this board (GP19 reserved for the PSRAM, nothing else)

[dut]
board = "CH32L103"                           # the profile
part = "CH32L103C8T6"                        # 64 KB flash (ESIG); recorded, not enforced
console = "dmseq"

[slot]                                       # oep config slot: the L103's RVSWD on GP0 / GP1; the L103 wants <= 1 MHz and SWCLK idling low
name = "l103"
wire = "rvswd"
pins = [0, 1]
attach = "at-boot"
retry_s = 1
mechanism = "dmseq"
max_speed = 1000000
idle_clock = "low"

[[bind]]                                     # the CDC port itself carries the slot's console
port = 0
stream = "slot:l103"

[wiring]                                     # nothing beyond the debug pair is known yet

[facts]
