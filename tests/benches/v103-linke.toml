# The CH32V103 bench until its P4 jig exists: a WCH-Link(CH549) and a CH32V103R8T6 with the Link's
# UART bridge on the variant's default Serial (USART1: PA9 -> Link RX, PA10 <- Link TX).
# No fixture beyond the UART, so tests that need wired pads, capture or an OEP
# host skip here. The machine's side, in tests/.env:
#
#   TEST_SERIAL_PORT_CH32V103=wchlink://434A124C5596
#   TEST_BENCH_CH32V103=v103-linke
#
# A WCH-Link's firmware is updated only by WCH's tools, so prepare.py can only
# --check this bench: model and firmware from `ch32rv probe list --json`.

[probe]
kind = "wchlink"
model = "WCH-Link(CH549)"                    # ch32rv probe list: model
variant = "link-ch549"                        # ch32rv probe list: variant (what the check compares, contract 4)
firmware = "2.12"                             # ch32rv probe list: firmware.norm

[dut]
board = "CH32V103"
part = "CH32V103R8T6"
console = "dmseq"

[uart]                                       # USART1 route 0 is the variant's default Serial on this board
usart = 1
route = 0

[wiring]                                     # only the UART reaches the probe
PA9 = "uart-rx"
PA10 = "uart-tx"

[facts]
capture_max_hz = 0
