# The CH32X035 bench until its P4 jig exists: a WCH-LinkE and a CH32X035C8T6 with the Link's
# UART bridge on the variant's default Serial (USART1: PB10 -> Link RX, PB11 <- Link TX).
# No fixture beyond the UART, so tests that need wired pads, capture or an OEP
# host skip here. The machine's side, in tests/.env:
#
#   TEST_SERIAL_PORT_CH32X035=wchlink://FC928F068181
#   TEST_BENCH_CH32X035=x035-linke
#
# A WCH-Link's firmware is updated only by WCH's tools, so prepare.py can only
# --check this bench: model and firmware from `ch32rv probe list --json`.

[probe]
kind = "wchlink"
model = "WCH-LinkE"                    # ch32rv probe list: model (display)
variant = "linke"                             # ch32rv probe list: variant (what the check compares, contract 4)
firmware = "2.22"                             # ch32rv probe list: firmware.norm

[dut]
board = "CH32X035"
part = "CH32X035C8T6"
console = "dmseq"

[uart]                                       # USART1 route 0 is the variant's default Serial on this board
usart = 1
route = 0

[wiring]                                     # only the UART reaches the probe
PB10 = "uart-rx"
PB11 = "uart-tx"

[facts]
capture_max_hz = 0
