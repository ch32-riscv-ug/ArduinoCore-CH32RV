# The X035 bench: an ESP32-P4 OEP probe and a CH32X035F8U6 fixture (E143 wiring).
#
# This file is the jig's design - what is wired to what, and which probe firmware
# and settings the tests were checked against. Build the same jig and it applies.
# Which unit is on this machine, and its IDE port, is the machine's business and
# lives in tests/.env:
#
#   TEST_SERIAL_PORT_CH32X035=oep://30eda0e31108-hs/x035
#   TEST_BENCH_CH32X035=x035-p4
#
# tests/bench/prepare.py --profile ch32x035 brings a probe to this state (erase,
# flash the release named here, write the slot / binds / plan, save) and
# `--check`, which tests/bench/conftest.py runs first, compares the probe to it.

[probe]
kind = "oep"
model = "esp32-p4-devkit"                    # oep.core describe: model
firmware = "3.2.0-v1rc"                      # oep.core describe: firmware. From oep-probe-arduino 0.0.5 on this is the release version.
profile = "io.github.ch32-riscv-ug.p4-x035"  # oep.core describe: profile
usb = "303a:0002"                            # how the probe enumerates; the serial is the oep:// address's probe part
release = "v0.0.4"                           # oep-probe-arduino tag prepare.py flashes
example = "Esp32P4X035Probe"                 # examples/<example> in that tag
erase = "all"                                # erase the whole flash before flashing

[dut]
board = "CH32X035"                           # the profile
part = "CH32X035F8U6"                        # what is soldered on; recorded, not enforced
console = "dmseq"                            # the harness talks over the debug module, no pin

[uart]                                       # the DUT UART the probe listens to: USART4 route 0, PB0 (TX) -> 12, PB1 (RX) <- 6
usart = 4
route = 0
tx = "PB0"                                   # the DUT pads it uses; the GPIO matrix leaves them alone
rx = "PB1"

[slot]                                       # oep config slot
name = "x035"
wire = "rvswd"
pins = [2, 54]
attach = "at-boot"
retry_s = 1
mechanism = "dmseq"

[[bind]]                                     # oep config bind: what each serial port carries
port = 1
mode = "last-reset"
streams = ["slot:x035"]

[[bind]]
port = 3
mode = "last-reset"
streams = ["slot:x035"]

[[plan]]                                     # oep config plan: pins an interface keeps
interface = "oep.fixture.uart#1"
roles = { rx = 12, tx = 6 }

[wiring]                                     # DUT pad -> probe channel. A pad not here is not wired; a test asking for it skips.
PA0 = 46
PA1 = 47
PA2 = 48
PA3 = 49
PA4 = 53
PA5 = 4
PA6 = 11
PA7 = 5
PB0 = 12
PB1 = 6
PB3 = 13
PB11 = 9
PB12 = 14
PC14 = 10
PC15 = 15
PC16 = 52
PC17 = 50

[facts]                                      # measured on this jig; tests use them as thresholds and skips
adc = ["PA0", "PA1", "PA2", "PA3", "PA4", "PA5", "PA6", "PA7"]   # the ADC-capable pads the probe can drive
adc_absent = ["PA3", "PA7"]                  # errata x035-adc-ch-i2c-unavailable on this part (ch3 / ch7 read residual charge)
adc_high_min = 960                           # probe rail == DUT VDD (both 3.3 V); 997 seen 2026-09-29
external_pullup = []                         # DUT pads a board pull-up holds high (idle high even in INPUT_PULLDOWN)
slow_release = ["PB3", "PB11", "PB12"]       # probe channels 13 / 9 / 14 (P4 SD-card pads) release slowly after driving high: their idle level is not a DUT fact
pulled_low = ["PC14", "PC15"]                # the X035's CC1 / CC2: the part holds them low, so they never float high (open-drain release, INPUT_PULLUP idle read 0)
capture_max_hz = 20000000                    # PARLIO
i2c = { scl = "PC16", sda = "PC17", route = 2 }
spi = { sck = "PA5", mosi = "PA7", miso = "PA6", cs = "PA4", pclk_hz = 48000000 }
pwm = "PA1"
