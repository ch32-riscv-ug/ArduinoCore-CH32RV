# TEMPORARY (2026-10-02, not committed): a WeAct CH32X035F8U6 board behind the ESP32-P4 30eda0e34a0e.
# Powered from the P4's 3V3 for now; its USB-C (PC16 / PC17, CC on PC14 / PC15) goes to a USB PD supply for
# the PD tests, so PC16 / PC17 are not wired to the probe. Wiring found by driving each pad through the debug
# module and reading the P4's channels (both pulls agree).
[probe]
kind = "oep"
model = "esp32p4"
firmware = "0.0.27"
release = "v0.0.27"
example = "Firmware/OepProbe"
sketch_profile = "esp32p4"
update = "dfu"
erase = "all"

[dut]
board = "CH32X035"
part = "CH32X035F8U6"
console = "dmseq"

[uart]                                       # USART4 route 0, PB0 (TX) -> 4, PB1 (RX) <- 3
usart = 4
route = 0
tx = "PB0"
rx = "PB1"

[slot]
name = "weact"
wire = "rvswd"
pins = [22, 23]
attach = "at-boot"
retry_s = 1
mechanism = "dmseq"
max_speed = 0
idle_clock = "high"

[[bind]]
port = 1
mode = "last-reset"
streams = ["slot:weact"]

[[bind]]
port = 3
mode = "last-reset"
streams = ["slot:weact"]

[[plan]]
interface = "oep.fixture.uart#0"
roles = { rx = 4, tx = 3 }

[[idle]]
channel = 3                                  # the DUT's USART4 RX: pulled up so it never floats
mode = "pull-up"

[wiring]
PA0 = 15
PA1 = 14
PA2 = 13
PA3 = 12
PA4 = 11
PA5 = 10
PA6 = 9
PA7 = 6
PB0 = 4
PB1 = 3
PB3 = 2
PB11 = 54
PB12 = 53
PC14 = 52
PC15 = 50

[facts]
adc = ["PA0", "PA1", "PA2", "PA3", "PA4", "PA5", "PA6", "PA7"]
adc_absent = ["PA3", "PA7"]                  # errata x035-adc-ch-i2c-unavailable on this part
adc_high_min = 960                           # probe rail == DUT VDD (the DUT runs from the probe's 3V3)
external_pullup = []
slow_release = ["PA1", "PA2", "PA6"]         # probe channels 14 / 13 / 9 are P4 SD-card pads: they release slowly
pulled_low = ["PC14", "PC15"]                # CC1 / CC2: the part and the board's Rd hold them low
capture_max_hz = 20000000
spi = { sck = "PA5", mosi = "PA7", miso = "PA6", cs = "PA4", pclk_hz = 48000000 }
pwm = "PA1"
