# What the hardware tests should cover (tests/coverage.py reads this with the runs' results).
#
# scope = "series": at least one pass on every series that has `needs` (each series' own driver, pins or clocks).
# scope = "once":   at least one pass on any series (shared code: a library above the drivers, a peer's protocol).
# test:  "<case>" (every test of the case) or "<case>::<test function>[<parameter>]" as junit names it, or a list of
#        them (any of them counts). No test: a feature the tests do not cover yet ("no test" in the report).
# needs: clock-enable names of the series' variant (tests/harness/series.py series_capabilities);
#        any_of: at least one of them. also: series that have it although the names miss it. not_on: series that
#        have the names but not what the item tests. also / not_on may name a part instead (choosing a bench's
#        cases; the coverage report is per series and does not see parts). A series without them shows n/a.
# kind:  "self" for a test where the DUT reads its own pads or registers back (selfcheck, selfbus, selfsys): reported
#        in a table of its own, as it does not stand for an outside observation (TEST_PLAN.ja.md).
# One item is one question: an item naming a whole case passes when any of the case's tests does, so a case asking
# several questions gets an item per test function.
# missing: series whose silicon has it and the core does not implement it yet - "未実装" in the report, counted as
#        wanted, not run. Everything is to be built (only BLE is left out, the user 2026-11-14): never write a
#        series the core lacks into not_on.
# tests/harness/place.py reads the same items to choose the cases a series can run.

