# What the hardware tests should cover (tests/coverage.py reads this with the runs' results).
#
# scope = "series": at least one pass on every series that has `needs` (each series' own driver, pins or clocks).
# scope = "once":   at least one pass on any series (shared code: a library above the drivers, a peer's protocol).
# test:  "<case>" (every test of the case) or "<case>::<test function>[<parameter>]" as junit names it, or a list of
#        them (any of them counts). No test: a feature the tests do not cover yet ("no test" in the report).
# needs: clock-enable names of the series' variant (tests/harness/series.py series_capabilities);
#        any_of: at least one of them. also: series that have it although the names miss it. not_on: series that
#        have the names but not what the item tests. A series without them shows n/a.
# tests/harness/place.py reads the same items to choose the cases a series can run.

[[item]]
id = "runtime"
test = "runtime"
scope = "series"

[[item]]
id = "uart"
test = "uart"
scope = "series"

[[item]]
id = "gpio"
test = "gpio"
scope = "series"

[[item]]
id = "flash"
test = "flash"
scope = "series"

[[item]]
id = "synckit"
test = "synckit"
scope = "series"

[[item]]
id = "logic"
test = "logic"
scope = "series"

[[item]]
id = "spi"
test = "spi"
scope = "series"
needs = ["SPI1"]

[[item]]
id = "wire"
test = "wire"
scope = "series"
needs = ["I2C1"]

[[item]]
id = "uart2"
test = "periph::test_serial_routes"
scope = "series"
any_of = ["USART2", "UART2"]

[[item]]
id = "pwm"
test = "signals::test_pwm"
scope = "series"
needs = ["TIM1"]

[[item]]
id = "capture-after-pwm"    # a pulse capture begins on a pad once its analogWrite() has stopped
test = "signals::test_capture_after_pwm"
scope = "series"
needs = ["TIM1"]

[[item]]
id = "adc"
test = "periph::test_adc"
scope = "series"
needs = ["ADC1"]

[[item]]
id = "usb-device"
test = ["usb", "usb-peer"]   # the host is this PC or the ESP32-S3: the same device driver either way
scope = "series"
any_of = ["USBFS", "USBHS", "USBHS1", "USBHS2", "USBD", "USB", "USBSS", "OTG_FS"]

[[item]]
id = "eth"
test = "eth"
scope = "series"
any_of = ["ETH_MAC", "ETH"]
also = ["CH32V208"]   # its MAC's clock enable is not named ETH in the variant

[[item]]
id = "pd"
test = "pd"
scope = "series"
any_of = ["USBPD", "USBPD0"]

[[item]]
id = "softspi"
test = "softspi"
scope = "once"

[[item]]
id = "softwire"
test = "softwire"
scope = "once"

[[item]]
id = "sd-spi"
test = "sd::test_sd_spi"
scope = "once"

[[item]]
id = "sd-sdio"
test = "sd::test_sd_sdio"
scope = "series"
needs = ["SDIO"]

[[item]]
id = "usb-classes"
test = "usb-classes"
scope = "once"

[[item]]
id = "usb-media"
test = "usb-media"
scope = "once"

[[item]]
id = "usb-peer"
test = "usb-peer"
scope = "once"

[[item]]
id = "usb-peer-classes"
test = "usb-peer-classes"
scope = "once"

[[item]]
id = "usb-peer-media"
test = "usb-peer-media"
scope = "once"

[[item]]
id = "usb-peer-net"
test = "usb-peer-net"
scope = "once"

[[item]]
id = "usb-peer-fs"
test = "usb-peer-fs"
scope = "once"

# CH32RVUsbHost drives the USBFS of the X03x and the USBOTG_FS layouts (CH32RVUsbHostPort.h), each series with its
# own 48 MHz: not V103's older USB, not the USBHS / USBSS-only series.
[[item]]
id = "usb-peer-host"
test = "usb-peer-host"
scope = "series"
any_of = ["USBFS", "OTG_FS"]
not_on = ["CH32V103"]

[[item]]
id = "usb-peer-host-classes"
test = "usb-peer-host-classes"
scope = "series"
any_of = ["USBFS", "OTG_FS"]
not_on = ["CH32V103"]

[[item]]
id = "hid"
test = "hid"
scope = "once"

[[item]]
id = "power"
test = "power"
scope = "once"

# Planned (no driver yet: the test fails once the lines are labelled).
[[item]]
id = "can"
test = "periph::test_planned[can]"
scope = "series"
any_of = ["CAN1", "CAN"]

[[item]]
id = "i2s"
test = "periph::test_planned[i2s]"
scope = "once"

[[item]]
id = "argb"
test = "periph::test_planned[argb]"
scope = "once"

[[item]]
id = "rs485"
test = "periph::test_planned[rs485]"
scope = "once"

[[item]]
id = "qspi"
test = "periph::test_planned[qspi]"
scope = "once"

# Not covered yet: the core has them, no hardware test does (docs/test-coverage.ja.md: テスト未定義).
[[item]]
id = "interrupt"            # attachInterrupt (EXTI, AFIO's EXTICR per series)
test = "signals::test_interrupt"
scope = "series"

[[item]]
id = "route"                # setRoute() / setPins() of the peripherals (remap registers per series); Serial's so far
