[[item]]
id = "adc-stream"           # CH32RVAdcStream (ADC with DMA)
test = "periph::test_adc_stream"
scope = "series"
needs = ["ADC1"]

[[item]]
id = "hs-adc"               # CH32RVHsAdc
scope = "series"
needs = ["HSADC"]

[[item]]
id = "servo"                # Servo (on the timers pwm covers)
test = "signals::test_servo"
scope = "once"

[[item]]
