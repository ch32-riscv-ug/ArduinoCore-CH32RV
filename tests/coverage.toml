[[item]]
id = "watchdog"             # wdtEnable / the IWDG on LSI (no IWDG on M030)
test = "system::test_watchdog_and_sleep"
scope = "series"
not_on = ["CH32M030"]

[[item]]
id = "dac"                  # analogWrite to a DAC pin
scope = "series"
needs = ["DAC"]

[[item]]
id = "wire-slave"           # Wire as an I2C target (onReceive / onRequest)
scope = "series"
needs = ["I2C1"]

[[item]]
