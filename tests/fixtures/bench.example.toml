# Copy to bench.local.toml and replace every empty identity/path field.
[targets.v103-link]
port = "" # /run/board-identify/by-id/... or /dev/serial/by-id/...
chip = "CH32V103R8T6"
fqbn = "ch32-riscv-ug:ch32rv:CH32V103:pnum=CH32V103R8T6"
f_cpu = 72000000
usb_topology = "" # This host's live USB device topology.
usb_vid = "1a86"
usb_pid = "8010"
usb_serial = ""
dut_uid = ""
cases = ["runtime", "uart", "power"]
power_ports = [] # Explicit probe port on the parent hub.

# OEP: probe_unit_id = "<complete-unit-id>" is required for USB-UART bridges.
# Dedicated OEP USB serial may supply the same identity.
# OEP: use dut_chip_id when target.info does not expose a DUT UID.
# Dedicated OEP USB probes also need upload_port = "oep://<unit-id>/<port>" (the port
# is the name of the probe's saved pin labels, S of S.swdio / S.swio).
# UIAPduino: chip CH32V003F4U6, fqbn ch32-riscv-ug:ch32rv:UIAPDUINO_V003_V14.
# HID: add soft_usb_topology and nrst_channel; power_ports contains both USB connections.
# Use upload_port = "ch32rv-hid://<soft_usb_topology>" for every UIAPduino upload.
# GPIO: gpio = [{ pad = "PA1", channel = <measured probe channel> }, ...].
# Declare only wired cases; UART-less L103 uses ["runtime", "power"].
# USB device (CH32X035/X033): cases = ["usb"], dut_usb_topology = "<the DUT's own USB port>".
# Ethernet (CH32H417 evaluation board): cases = ["eth"], fqbn = "ch32-riscv-ug:ch32rv:CH32H417",
# f_cpu = 100000000; the RJ45 on this host's LAN with DHCP, the USB3.0-A (SS) cable out for SWD.
