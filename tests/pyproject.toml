[project]
name = "arduinocore-ch32-tests"
version = "0.0.0"
description = "Hardware and build tests for the ArduinoCore-CH32 platform"
readme = "README.ja.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TANAKA Masayuki" }]
dependencies = [
  "pytest>=8",
  "pytest-embedded>=2.0",
  "pytest-embedded-serial>=2.0",
  "pytest-embedded-arduino-cli>=1.1",
  "pytest-html>=4.1.1",
  # Bench-only: lets detected_chip() send the WCH-LinkE redetect command
  # (Control subcommand 3) that clears the stale-target state without a reset.
  "pyusb>=1.2",
]

[tool.pytest.ini_options]
# One entry point for everything: `pytest` walks the whole tree and each kind of
# check lives in its own directory (generated, vendor, startup, compile,
# sizebench, package, sketches, unit). The layout itself is a test - see
# unit/test_tests_layout.py - so a stray file at the root fails rather than
# quietly running from the wrong place.
#
# `.` rather than the eight directories by name: a new category that nobody
# remembered to list here would be collected silently by the first form and
# silently *not* collected by the second, and a check that never runs is worse
# than one that runs in the wrong order.
testpaths = ["."]
# This replaces pytest's default list rather than adding to it, so everything
# that has to stay out is named here - including the dot-directories the
# default `.*` entry used to cover.
#   manual   flashes the attached board; reached only by naming a file
#   */build  harness scratch, when a run was interrupted mid-compile
# Nothing is called `dist` on purpose: that name is in pytest's own default
# list, so a directory with it would vanish from collection the day this line
# is simplified. The Board Manager install test lives in package/.
norecursedirs = [".venv", ".tools", ".git", ".pytest_cache", "__pycache__",
                 "manual", "*/build"]
addopts = "-ra --strict-markers"
# pytest-embedded pulls in record_xml_attribute for every test, which warns
# about being experimental even for tests that never touch a board.
filterwarnings = [
  "ignore::pytest.PytestExperimentalApiWarning",
]
markers = [
  "slow: takes minutes (the compile sweeps)",
  "hardware: needs a board attached",
]
