[project]
name = "arduinocore-ch32-tests"
version = "0.0.0"
description = "Hardware and build tests for the ArduinoCore-CH32 platform"
readme = "README.ja.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TANAKA Masayuki" }]
dependencies = [
  "pytest>=8",
  "pytest-embedded>=2.0",
  "pytest-embedded-serial>=2.0",
  "pytest-embedded-arduino-cli>=1.1",
  "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
# The whole tree, not just sketches/: the build harnesses have pytest wrappers
# beside conftest.py so `pytest` is one entry point. manual/ is reached only by
# naming a file, because its files deliberately have no test_ prefix.
testpaths = ["."]
norecursedirs = [".venv", "manual", "*/build", ".tools"]
addopts = "-ra --strict-markers"
# pytest-embedded pulls in record_xml_attribute for every test, which warns
# about being experimental even for tests that never touch a board.
filterwarnings = [
  "ignore::pytest.PytestExperimentalApiWarning",
]
markers = [
  "slow: takes minutes (the compile sweeps)",
  "hardware: needs a board attached",
]
