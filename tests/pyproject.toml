[project]
name = "arduinocore-ch32-tests"
version = "0.0.0"
description = "Board-free checks for ArduinoCore-CH32RV"
requires-python = ">=3.13"
dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["unit", "build"]
norecursedirs = [".*", "__pycache__", "single", "loopback", "peer",
                "instrumented", "manual", "fixtures", "diagnostics"]
addopts = "-ra --strict-markers --import-mode=importlib"
