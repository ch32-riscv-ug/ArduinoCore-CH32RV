[project]
name = "arduinocore-ch32-tests"
version = "0.0.0"
description = "Board-free checks for ArduinoCore-CH32RV"
requires-python = ">=3.13"
dependencies = ["pytest>=8"]

[project.optional-dependencies]
hardware = [
    "oep-client-python[pytest]==0.0.55",
    "pytest-embedded-arduino-cli==1.12.0",
    "pytest-embedded-arduino-cli-ch32rv==0.0.10",
    "pytest-embedded-wireskein==0.0.7",
    "wireskein==0.0.27",
]

[tool.pytest.ini_options]
testpaths = ["unit", "platform"]
norecursedirs = [".*", "__pycache__", "single", "loopback", "peer",
                "instrumented", "manual", "fixtures", "diagnostics", "hw"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["."]
# The records on the OEP probes (oep-client's pytest plugin: port_memo, OEP_PORT_MEMO_<id>[_<port>]; RECORDS.ja.md).
oep_memo_owner = "io.github.ch32-riscv-ug.arduino"
# The bench's combinations (tests/hw; profiles in tests/hw/profiles.toml, ports in tests/.env). One per board with
# its standard wiring - every case it can run - and one per configuration that differs (probe route, peer, clock).
arduino_combos = [
  "x035c8t6-s3: primary=x035c8t6-s3",
  "x035c8t6-pico: primary=x035c8t6-pico",
]
