# The RP2040 (a Raspberry Pi Pico on the DUT's OEP probe) as the USB host for tests/peer/usb/device; the DUT
# is the device. Pinned core and library: the peer is a fixed reference, not under test. The generic board
# with boot2_generic_03h: the bench's Pico is a clone whose flash (Fudan, 32 Mbit) the Pico's own boot2
# misreads. TinyUSB is the runner's patched Adafruit TinyUSB Library (sketch_support/usb_peer/pico).
profiles:
  pico:
    fqbn: rp2040:rp2040:generic:boot2=boot2_generic_03h_4_padded_checksum,uploadmethod=picoprobe_cmsis_dap,usbstack=tinyusb_host
    platforms:
      - platform: rp2040:rp2040 (6.3.2)
        platform_index_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    libraries:
      - RTT Stream (1.4.1)
      - TINYUSB
default_profile: pico
