# One profile per target board. Adding a board = adding a profile here.
#
# platform_index_url must point at an index arduino-cli can install from:
# sketch profiles resolve only index-installed platforms, so the R-15 method A
# (symlinking the repo into <sketchbook>/hardware/) does NOT work with profiles.
# For local development, generate and serve the index first:
#
#   python3 tools/index/gen_index.py --platform . --out /tmp/idx \
#       --base-url http://127.0.0.1:8781 --tools local
#   (cd /tmp/idx && python3 -m http.server 8781)
#
# and point platform_index_url at http://127.0.0.1:8781/package_ch32-riscv-ug_index.json
#
# NOTE: arduino-cli 1.3.1 panics (not errors) if a profile omits `platforms`.
#
# `programmer:` selects the non-serial upload path. Verified with arduino-cli 1.3.1:
# `arduino-cli upload --profile <p>` uses programmers.txt + tools.<t>.program.pattern
# and needs no --port, and keeps using it even when --port is also passed (which the
# pytest plugin does for the runtime serial). The platform now ships `wch-link`,
# which drives probe-rs; verified end to end on CH32V203 hardware (experiment 0012).
#
# Every profile targets the board's ANY part number: the acceptance sketch only
# needs Serial, which the variant places on pins that exist on every package.
# The default Serial port per board comes from the generated variant
# (CH32_SERIAL_DEFAULT); it is USART1 on V003/V307 and USART2 elsewhere, because
# USART1's pins are not bonded out on every package of those series.

# --- generated by sync_profiles.py: do not edit below ---
profiles:
  # tier A: main target; 24-bit ports, 48 MHz, 2 wait states
  ch32x035:
    fqbn: ch32-riscv-ug:ch32v:CH32X035:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

  # tier A: the other extreme: rv32ec, 24 MHz, 16 K flash
  ch32v003:
    fqbn: ch32-riscv-ug:ch32v:CH32V003:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

  # tier B: the mainstream V2 part
  ch32v203:
    fqbn: ch32-riscv-ug:ch32v:CH32V203:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

  # tier B: low-power V4C
  ch32l103:
    fqbn: ch32-riscv-ug:ch32v:CH32L103:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

  # tier B: the only family with a jump-table vector
  ch32v103:
    fqbn: ch32-riscv-ug:ch32v:CH32V103:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

  # tier B: largest part on the bench
  ch32v307:
    fqbn: ch32-riscv-ug:ch32v:CH32V307:pnum=ANY
    programmer: wch-link
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

default_profile: ch32x035
# --- end generated ---
