# One profile per target board. Adding a board = adding a profile here.
#
# platform_index_url must point at an index arduino-cli can install from:
# sketch profiles resolve only index-installed platforms, so the R-15 method A
# (symlinking the repo into <sketchbook>/hardware/) does NOT work with profiles.
# For local development, generate and serve the index first:
#
#   python3 tools/index/gen_index.py --platform . --out /tmp/idx \
#       --base-url http://127.0.0.1:8781 --tools local
#   (cd /tmp/idx && python3 -m http.server 8781)
#
# and point platform_index_url at http://127.0.0.1:8781/package_ch32-riscv-ug_index.json
#
# NOTE: arduino-cli 1.3.1 panics (not errors) if a profile omits `platforms`.
#
# `programmer:` selects the non-serial upload path. Verified with arduino-cli 1.3.1:
# `arduino-cli upload --profile <p>` uses programmers.txt + tools.<t>.program.pattern
# and needs no --port, and keeps using it even when --port is also passed (which the
# pytest plugin does for the runtime serial). The programmer itself is still
# undecided (Q-040/Q-044), so it is commented out until the platform ships one.

profiles:
  ch32v00x:
    fqbn: ch32-riscv-ug:ch32v:CH32V00X:pnum=CH32V006K8U7
    # programmer: wch-linke
    platforms:
      - platform: ch32-riscv-ug:ch32v (0.0.1)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32/package_ch32-riscv-ug_index.json

default_profile: ch32v00x
